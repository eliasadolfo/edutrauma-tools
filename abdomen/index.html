/* ============ Analytics (anónimo, compartido con el hub) ============ */
const ET_EVENTS_URL = 'https://devn8n.tuescuelademarcas.cl/webhook/et-tools-event';
/* Cola offline: si no hay conexión, el evento se guarda y se reenvía después */
function etEnqueue(p){
  try{
    const q = JSON.parse(localStorage.getItem('et_queue') || '[]');
    q.push(p);
    while (q.length > 200) q.shift();
    localStorage.setItem('et_queue', JSON.stringify(q));
  }catch(e){}
}
function etPost(p){
  return fetch(ET_EVENTS_URL, {
    method: 'POST', keepalive: true,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(p)
  }).then(r => { if (!r.ok) throw new Error('http'); });
}
function etFlushQueue(){
  let q = [];
  try{ q = JSON.parse(localStorage.getItem('et_queue') || '[]'); }catch(e){}
  if (!q.length) return;
  try{ localStorage.setItem('et_queue', '[]'); }catch(e){}
  q.forEach(p => etPost(p).catch(() => etEnqueue(p)));
}
window.addEventListener('online', etFlushQueue);
etFlushQueue();

function etAnonId(){
  let id = localStorage.getItem('et_anon');
  if (!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'a-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('et_anon', id);
  }
  return id;
}
function sendEvent(event, extra){
  try{
    let p = {}; try{ p = JSON.parse(localStorage.getItem('et_profile') || '{}'); }catch(e){}
    const __p = {
        ts: new Date().toISOString(), anon_id: etAnonId(), event: event, tool: 'abdomen',
        lang: (typeof LANG !== 'undefined' ? LANG : ''), country: p.country || '', specialty: p.specialty || '',
        tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ''), ua: navigator.userAgent.slice(0, 180),
        extra: extra || {}
      };
    etPost(__p).catch(() => etEnqueue(__p));
  }catch(e){}
}

const LANG_NAMES = { es: "Español", en: "English", pt: "Português" };

function detectLang(){
  const saved = localStorage.getItem('lang');
  if (saved && I18N[saved]) return saved;
  const nav = (navigator.language || 'es').toLowerCase();
  if (nav.startsWith('pt')) return 'pt';
  if (nav.startsWith('en')) return 'en';
  return 'es';
}

let LANG = detectLang();
function T(){ return I18N[LANG]; }

const LANGS = ['es', 'en', 'pt'];

function setLang(lang){
  LANG = lang;
  localStorage.setItem('lang', lang);
  applyStaticTexts();
  if (typeof refreshInstallBanner === 'function') refreshInstallBanner();

  // Si estamos en la pantalla de inicio, actualizar en sitio para que
  // el thumb DESLICE (un re-render mataría la animación).
  const sw = document.getElementById('langSwitch');
  if (sw){
    sw.dataset.active = LANGS.indexOf(lang);
    sw.querySelectorAll('button').forEach((b, i) => {
      b.classList.toggle('active', LANGS[i] === lang);
      b.setAttribute('aria-pressed', LANGS[i] === lang);
    });
    const t = T();
    document.getElementById('startRules').innerHTML = startRulesHTML(t);
    document.getElementById('startBtn').textContent = t.startBtn;
  } else {
    renderMenu();
  }
}

function startRulesHTML(t){
  return `<h2>${t.rulesHeading}</h2>` + t.rules.map(r =>
    `<div class="rule-item"><div class="rule-dot"></div><div><b>${r[0]}</b> ${r[1]}</div></div>`
  ).join('');
}

function applyStaticTexts(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.getElementById('brandRibbon').textContent = t.ribbon;
  document.getElementById('appTitle').textContent = t.title;
  document.getElementById('appSubtitle').textContent = t.subtitle;
  document.getElementById('appFooter').innerHTML = t.footer;
  document.getElementById('installText').innerHTML = t.installText;
  document.getElementById('installBtn').textContent = t.installBtn;
}

      { id:'cffma',  t:'num', label:'CFF · MA',  unit:'mm', plaus:[0,100], help:'Fibrinógeno — amplitud máxima funcional' },
      { id:'ly30',   t:'num', label:'CRT · LY30', unit:'%', plaus:[0,100], help:'Fibrinólisis a los 30 min post-MA' }
    ],
    compute(v){
      const comp = [], alerts = [];
      const hep = v.hep === 'si';

      /* Paso 1 — efecto de heparina */
      if(hep){
        const d = v.ckr - v.ckhr;
        if(v.ckr < v.ckhr){
          alerts.push({ level:'warn', title:'Resultado inconsistente (N/A)',
            text:'CK-R es menor que CKH-R, lo que no es fisiológicamente esperable. <b>Revisar manualmente</b> la muestra y los valores ingresados.' });
        } else if(d > this.heparinMinDiff){
          alerts.push({ level:'alert', title:'Efecto de heparina presente',
            text:'CK-R ('+v.ckr+' min) es mayor que CKH-R ('+v.ckhr+' min). Considerar reversión con <b>protamina</b> según protocolo institucional y la dosis/tiempo de heparina recibida.' });
        } else {
          alerts.push({ level:'ok', title:'Sin efecto de heparina',
            text:'CK-R y CKH-R son equivalentes: no se detecta efecto residual de heparina.' });
        }
      }

      /* Paso 2 — factores de coagulación */
      const rVal = hep ? v.ckhr : v.ckr;
      const rName = hep ? 'CKH-R' : 'CK-R';
      const rLo = hep ? 4.3 : 4.6, rHi = hep ? 8.3 : 9.1;
      if(rVal > rHi) comp.push({ name:'Factores de coagulación', level:'alert',
        value:rName+' '+rVal+' min (R prolongado · normal '+rLo+'–'+rHi+')',
        finding:'Déficit de factores de coagulación.',
        sug:'Considerar <b>plasma fresco congelado (PFC)</b>. Si hay INR/TTPA disponibles, usarlos para confirmar antes de indicar. <i>(Guía europea del trauma 6.ª ed., Rec. 27–28, Grado 1C)</i>' });
      else if(rVal < rLo) comp.push({ name:'Factores de coagulación', level:'warn',
        value:rName+' '+rVal+' min (R acortado · normal '+rLo+'–'+rHi+')',
        finding:'Factores elevados — patrón protrombótico.',
        sug:'<b>No</b> se sugieren hemoderivados. Considerar evaluación de riesgo de <b>TVP/TEP</b> según el contexto clínico.' });
      else comp.push({ name:'Factores de coagulación', level:'ok',
        value:rName+' '+rVal+' min (normal '+rLo+'–'+rHi+')',
        finding:'Sin déficit relevante de factores.', sug:'' });

      /* Paso 3 — plaquetas (MA prima sobre A10) */
      const pl = (v.crtma < 52) || (v.crtma >= 52 && v.crtma <= 70 && v.crta10 < 44);
      const plAlta = v.crtma > 70;
      if(pl) comp.push({ name:'Plaquetas', level:'alert',
        value:'CRT-A10 '+v.crta10+' mm (44–67) · CRT-MA '+v.crtma+' mm (52–70)',
        finding:'Función plaquetaria baja.',
        sug:'Considerar <b>transfusión de plaquetas</b>. <i>(Guía europea del trauma 6.ª ed., Rec. 25, Grado 2B)</i>' });
      else if(plAlta) comp.push({ name:'Plaquetas', level:'warn',
        value:'CRT-A10 '+v.crta10+' mm (44–67) · CRT-MA '+v.crtma+' mm (52–70)',
        finding:'Función plaquetaria alta.', sug:'No requiere transfusión. Interpretar en el contexto clínico.' });
      else comp.push({ name:'Plaquetas', level:'ok',
        value:'CRT-A10 '+v.crta10+' mm · CRT-MA '+v.crtma+' mm',
        finding:'Función plaquetaria normal.', sug:'' });

      /* Paso 4 — fibrinógeno (MA prima sobre A10) */
      const fb = (v.cffma < 15) || (v.cffma >= 15 && v.cffma <= 32 && v.cffa10 < 15);
      const fbAlto = v.cffma > 32;
      if(fb) comp.push({ name:'Fibrinógeno', level:'alert',
        value:'CFF-A10 '+v.cffa10+' mm (15–30) · CFF-MA '+v.cffma+' mm (15–32)',
        finding:'Fibrinógeno bajo.',
        sug:'Considerar <b>crioprecipitado o concentrado de fibrinógeno</b>. Evitar corregir solo con PFC si hay crioprecipitado/concentrado disponible. <i>(Guía europea del trauma 6.ª ed., Rec. 25 y 27, Grado 1C)</i>' });
      else if(fbAlto) comp.push({ name:'Fibrinógeno', level:'warn',
        value:'CFF-A10 '+v.cffa10+' mm (15–30) · CFF-MA '+v.cffma+' mm (15–32)',
        finding:'Fibrinógeno alto.', sug:'No requiere aporte. Interpretar en el contexto clínico.' });
      else comp.push({ name:'Fibrinógeno', level:'ok',
        value:'CFF-A10 '+v.cffa10+' mm · CFF-MA '+v.cffma+' mm',
        finding:'Fibrinógeno normal.', sug:'' });

      /* Paso 5 — fibrinólisis */
      if(v.ly30 > 2.2) comp.push({ name:'Fibrinólisis', level:'alert',
        value:'CRT-LY30 '+v.ly30+'% (normal 0–2.2%)',
        finding:'Hiperfibrinólisis.',
        sug:'Sugerir/reforzar <b>ácido tranexámico (TXA)</b>: 1 g IV en 10 min + 1 g IV en 8 h, idealmente dentro de las 3 h del trauma. Si el paciente ya recibió TXA empírico, esto <b>refuerza la indicación</b>; no implica una segunda dosis automática. <i>(Guía europea del trauma 6.ª ed., Rec. 23, Grado 1A; CRASH-2)</i>' });
      else comp.push({ name:'Fibrinólisis', level:'ok',
        value:'CRT-LY30 '+v.ly30+'% (normal 0–2.2%)',
        finding:'Sin hiperfibrinólisis.', sug:'' });

      return { comp, alerts };
    }
  }
};
const MIAA_LVL = { ok:'#1F7A5C', warn:'#B7791F', alert:'#E02826', info:'#00205C' };
let algoState = null;

function renderMenu(){
  setFlow(false);
  const t = T();
  document.getElementById('appTitle').textContent = t.menuTitle;
  document.getElementById('appSubtitle').textContent = t.menuSubtitle;
  const cards = t.menuAlgos.map(a => `
    <button class="organ-btn" style="text-align:left;padding:15px 17px;width:100%;margin-bottom:10px;" onclick="openMiaa('${a.id}')">
      <span style="display:block;font-weight:700;">${a.title}</span>
      <span style="display:block;font-size:0.82rem;font-weight:400;opacity:0.68;margin-top:3px;">${a.desc}</span>
    </button>`).join('');
  document.getElementById('main').innerHTML = cards +
    (window.etToolFooter ? etToolFooter(t.hubLink, t.fbLink) : '');
}

function openMiaa(id){
  if(id === 'decision'){ renderStart(); return; }
  const algo = MIAA_ALGOS[id];
  if(!algo) return;
  const t0 = T(); // restaura la cabecera del contenedor (el algoritmo de decisión pone la suya)
  document.getElementById('appTitle').textContent = t0.menuTitle;
  document.getElementById('appSubtitle').textContent = t0.menuSubtitle;
  algoState = { id, algo, nodeId:algo.start, ctx:{}, hist:[], vals:{ hep:'no' } };
  sendEvent('miaa_open', { algo:id });
  if(algo.type === 'steps') renderMiaaSteps();
  else if(algo.type === 'form') renderMiaaForm();
  else renderMiaaNode();
}

function miaaHeader(){
  const t = T();
  const back = algoState.hist.length
    ? `<button class="back-btn" onclick="miaaBack()">${t.backLast}</button>`
    : `<button class="back-btn" onclick="renderMenu()">${t.menuAll}</button>`;
  return `<div class="back-row">${back}</div>
    <div class="category-badge"><span>${algoState.algo.name}</span></div>`;
}

function renderMiaaNode(){
  setFlow(false); window.scrollTo(0,0);
  const node = algoState.algo.nodes[algoState.nodeId];
  const opts = node.opts.map((o,i)=>`
    <button class="organ-btn" style="text-align:left;padding:16px 18px;width:100%;margin-bottom:10px;" onclick="miaaPick(${i})">
      <span style="display:block;font-weight:700;">${o.label}</span>
      ${o.sub?`<span style="display:block;font-size:0.82rem;font-weight:400;opacity:0.68;margin-top:3px;">${o.sub}</span>`:''}
    </button>`).join('');
  document.getElementById('main').innerHTML = miaaHeader() +
    `<div class="question-text">${node.q}</div>` +
    (node.help?`<p style="font-size:0.88rem;color:var(--et-muted);line-height:1.5;margin:2px 0 10px;">${node.help}</p>`:'') +
    `<div style="margin-top:6px;">${opts}</div>`;
}

function miaaPick(i){
  const node = algoState.algo.nodes[algoState.nodeId];
  const o = node.opts[i];
  algoState.hist.push({ nodeId:algoState.nodeId, ctx:Object.assign({},algoState.ctx) });
  Object.assign(algoState.ctx, o.set||{});
  if(o.next == null){
    const r = algoState.algo.resolve(algoState.ctx);
    sendEvent('miaa_result', { algo:algoState.id, level:r.level, title:r.title });
    if(window.etFbAfterUse) etFbAfterUse();
    renderMiaaResult(r);
  } else {
    algoState.nodeId = o.next;
    renderMiaaNode();
  }
}

function miaaBack(){
  const prev = algoState.hist.pop();
  if(!prev){ renderMenu(); return; }
  algoState.nodeId = prev.nodeId; algoState.ctx = prev.ctx;
  renderMiaaNode();
}

function renderMiaaResult(r){
  window.scrollTo(0,0);
  const t = T();
  const color = MIAA_LVL[r.level] || '#00205C';
  const list = r.list ? `<div style="text-align:left;margin-top:14px;">` + r.list.map(x=>
    `<div class="rule-item"><div class="rule-dot"></div><div>${x}</div></div>`).join('') + `</div>` : '';
  document.getElementById('main').innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="renderMiaaNode()">${t.backLast}</button></div>
    <div class="result-card bjorck" style="justify-content:center;text-align:center;">
      <div class="result-eyebrow">${algoState.algo.name}</div>
      <div class="question-text" style="font-size:1.45rem;line-height:1.25;margin:8px 0 4px;color:${color};">${r.title}</div>
      <div class="result-detail" style="margin-top:8px;">${r.detail}</div>
      ${list}
      ${r.warn?`<div class="calc-alert">${r.warn}</div>`:''}
      ${r.goto?`<button class="calc-btn" style="margin-top:16px;" onclick="openMiaa('${r.goto.id}')">${r.goto.label}</button>`:''}
      <div class="calc-formula"><b>Referencia:</b> ${algoState.algo.ref}</div>
    </div>
    <button class="restart-btn" onclick="renderMenu()">${t.menuAll}</button>
  `;
}

/* ---------- Formulario (TEG) ---------- */
function tegFields(){
  return algoState.algo.fields.filter(f => !f.onlyIfHep || algoState.vals.hep === 'si');
}
function renderMiaaForm(){
  setFlow(false); window.scrollTo(0,0);
  const t = T(), a = algoState.algo, v = algoState.vals;
  const fields = tegFields().map(f=>{
    if(f.t === 'seg'){
      const opts = f.options.map(o=>`<button class="${v[f.id]===o.v?'on':''}" onclick="tegSeg('${f.id}','${o.v}')">${o.label}</button>`).join('');
      return `<div class="calc-field"><label>${f.label}</label><div class="seg">${opts}</div></div>`;
    }
    const bad = v[f.id]!==undefined && !isNaN(v[f.id]) && (v[f.id]<f.plaus[0] || v[f.id]>f.plaus[1]);
    return `<div class="calc-field"><label>${f.label}</label>
      <div class="row"><input type="number" inputmode="decimal" step="0.1" id="teg_${f.id}"
        oninput="tegNum('${f.id}',this.value)" value="${v[f.id]??''}"><div class="unit">${f.unit}</div></div>
      <div style="font-size:0.78rem;color:var(--et-muted);margin-top:4px;">${f.help}</div>
      ${bad?`<div style="font-size:0.78rem;color:#B7791F;margin-top:4px;">⚠ Valor fuera del rango habitual — revise que no sea un error de digitación.</div>`:''}
    </div>`;
  }).join('');
  const ready = tegFields().every(f => f.t==='seg' ? v[f.id]!==undefined : (v[f.id]!==undefined && !isNaN(v[f.id])));
  document.getElementById('main').innerHTML = miaaHeader() +
    `<p style="font-size:0.88rem;color:var(--et-muted);line-height:1.5;margin:2px 0 14px;">${a.intro}</p>` +
    fields +
    `<button class="calc-btn" onclick="tegGo()" ${ready?'':'disabled'}>Interpretar ›</button>`;
}
function tegSeg(id,val){ algoState.vals[id]=val; if(id==='hep'&&val==='no') delete algoState.vals.ckhr; renderMiaaForm(); }
function tegNum(id,val){ algoState.vals[id] = val==='' ? undefined : parseFloat(val); const b=document.querySelector('.calc-btn'); if(b){ const v=algoState.vals; b.disabled = !tegFields().every(f=> f.t==='seg' ? v[f.id]!==undefined : (v[f.id]!==undefined && !isNaN(v[f.id]))); } }
function tegGo(){
  const r = algoState.algo.compute(algoState.vals);
  sendEvent('miaa_result', { algo:algoState.id, level:(r.comp.some(c=>c.level==='alert')?'alert':'ok') });
  if(window.etFbAfterUse) etFbAfterUse();
  renderTegSummary(r);
}
function renderTegSummary(r){
  window.scrollTo(0,0);
  const t = T(), a = algoState.algo;
  const alertHTML = r.alerts.map(al=>`
    <div style="border:1px solid ${MIAA_LVL[al.level]};background:${al.level==='ok'?'#eef7f3':al.level==='warn'?'#fdf6e7':'#fdecea'};
      border-radius:11px;padding:12px 14px;margin-bottom:10px;text-align:left;">
      <div style="font-weight:800;font-size:0.9rem;color:${MIAA_LVL[al.level]};">${al.title}</div>
      <div style="font-size:0.86rem;line-height:1.5;margin-top:3px;">${al.text}</div></div>`).join('');
  const compHTML = r.comp.map(c=>`
    <div style="border:1px solid var(--et-line);border-left:4px solid ${MIAA_LVL[c.level]};background:var(--et-bg);
      border-radius:11px;padding:12px 14px;margin-bottom:10px;text-align:left;">
      <div style="font-weight:800;font-size:0.95rem;color:${MIAA_LVL[c.level]};">${c.name} — ${c.finding}</div>
      <div style="font-size:0.8rem;color:var(--et-muted);margin-top:3px;">${c.value}</div>
      ${c.sug?`<div style="font-size:0.86rem;line-height:1.55;margin-top:7px;">${c.sug}</div>`:''}
    </div>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="renderMiaaForm()">‹ Corregir valores</button></div>
    <div class="category-badge"><span>${a.name}</span></div>
    <div class="result-eyebrow" style="margin:10px 0 8px;">Interpretación del panel</div>
    ${alertHTML}${compHTML}
    <div class="caution-box">Apoyo a la decisión clínica: las sugerencias deben ser confirmadas por el médico responsable y contrastadas con el protocolo institucional. No constituyen una indicación terapéutica automática.</div>
    <div class="calc-formula"><b>Referencia:</b> ${a.ref}</div>
    <button class="restart-btn" onclick="renderMenu()">${t.menuAll}</button>
  `;
}

function renderMiaaSteps(){
  setFlow(false); window.scrollTo(0,0);
  const t = T(); const a = algoState.algo;
  const blocks = a.steps.map(s=>`
    <div class="region-block">
      <div class="region-title" ${s.alert?'style="color:#E02826"':''}>${s.n}</div>
      ${s.items.map(([h,d])=>`<div class="pet" style="background:var(--et-bg);border:1px solid var(--et-line);border-radius:11px;padding:12px 14px;margin-bottom:8px;">
        <div style="font-weight:700;font-size:0.92rem;">${h}</div>
        <div style="font-size:0.86rem;color:var(--et-muted);margin-top:3px;line-height:1.5;">${d}</div></div>`).join('')}
    </div>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="renderMenu()">${t.menuAll}</button></div>
    <div class="category-badge"><span>${a.name}</span></div>
    <p style="font-size:0.9rem;line-height:1.55;margin:6px 0 4px;">${a.intro}</p>
    <p style="font-size:0.86rem;color:var(--et-muted);line-height:1.5;margin:0 0 14px;">${a.note}</p>
    ${blocks}
    <div class="calc-formula" style="margin-top:6px;"><b>Referencia:</b> ${a.ref}</div>
    <button class="restart-btn" onclick="renderMenu()">${t.menuAll}</button>
  `;
  sendEvent('miaa_result', { algo:algoState.id, level:'info' });
  if(window.etFbAfterUse) etFbAfterUse();
}

/* ============ Estado ============ */
let currentIndex = 0;
let history = [];
let bjorckIndex = 0;
let bjorckAnswers = {};
let inBjorckFlow = false;

// Modo flujo: compacta la cabecera para que cada pantalla quepa sin scroll
function setFlow(on){
  document.querySelector('.app').classList.toggle('in-flow', on);
  document.getElementById('progressWrap').style.display = on ? '' : 'none';
  window.scrollTo(0, 0);
}

function renderStart(){
  setFlow(false);
  const t = T();
  // Restaura el título propio de este algoritmo (el menú lo sobreescribe)
  document.getElementById('appTitle').textContent = t.title;
  document.getElementById('appSubtitle').textContent = t.subtitle;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="renderMenu()">${t.menuAll}</button></div>
    <div class="start-rules" id="startRules">${startRulesHTML(t)}</div>
    <div class="anim-pop"><button class="start-btn" id="startBtn" onclick="startFlow()">${t.startBtn}</button></div>
    ${window.etToolFooter ? etToolFooter(t.hubLink, t.fbLink) : ''}
  `;
}

function startFlow(){
  let p = {};
  try{ p = JSON.parse(localStorage.getItem('et_profile') || '{}'); }catch(e){}
  if (!p.specialty){ renderSpecialtyPicker(); return; }
  beginEvaluation();
}

function beginEvaluation(){
  currentIndex = 0;
  history = [];
  inBjorckFlow = false;
  bjorckIndex = 0;
  bjorckAnswers = {};
  setFlow(true);
  renderQuestion();
}

function renderSpecialtyPicker(){
  setFlow(true);
  const t = T();
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '';
  document.getElementById('categoryText').textContent = '';
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row"></div>
    <div class="card">
      <div class="question-text">${t.specTitle}</div>
      <p class="spec-sub">${t.specSub}</p>
      <div class="spec-grid">
        ${t.specialties.map(s => `<button onclick="pickSpecialty(this.textContent)">${s}</button>`).join('')}
      </div>
    </div>
  `;
}

function pickSpecialty(s){
  const t = T();
  // "Otra" → preguntar cuál (texto libre)
  if (s === t.specialties[t.specialties.length - 1]){
    renderOtherSpecialty();
    return;
  }
  saveSpecialty(s, beginEvaluation);
}

function renderOtherSpecialty(){
  const t = T();
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="renderSpecialtyPicker()">${t.backPrev}</button>
    </div>
    <div class="card">
      <div class="question-text">${t.specTitle}</div>
      <input class="spec-input" id="specOther" maxlength="60" placeholder="${t.specOtherPh}"
        oninput="document.getElementById('specGo').disabled = !this.value.trim()">
      <button class="spec-continue" id="specGo" disabled
        onclick="saveSpecialty(document.getElementById('specOther').value.trim(), beginEvaluation)">${t.specContinue}</button>
    </div>
  `;
  setTimeout(() => document.getElementById('specOther').focus(), 100);
}

function saveSpecialty(s, next){
  if (!s) return;
  let p = {};
  try{ p = JSON.parse(localStorage.getItem('et_profile') || '{}'); }catch(e){}
  p.specialty = s.slice(0, 60);
  try{ localStorage.setItem('et_profile', JSON.stringify(p)); }catch(e){}
  sendEvent('profile_saved', { specialty: p.specialty });
  next();
}

function renderQuestion(){
  setFlow(true);
  const t = T();
  const q = t.questions[currentIndex];
  const total = t.questions.length;
  document.getElementById('progressFill').style.width = ((currentIndex)/total*100) + '%';
  document.getElementById('progressText').textContent = t.progressQ(currentIndex+1, total);
  document.getElementById('categoryText').textContent = '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row">
      ${history.length ? `<button class="back-btn" onclick="goBack()">${t.backPrev}</button>` : ''}
    </div>
    <div class="category-badge">${ICONS[q.icon]}<span>${q.category}</span></div>
    <div class="card">
      <div class="question-text">${q.text}</div>
      <div class="answers">
        <button class="answer-btn no" onclick="answer('no')">${t.no}</button>
        <button class="answer-btn yes" onclick="answer('yes')">${t.yes}</button>
      </div>
    </div>
  `;
}

function renderResult(result){
  window.scrollTo(0, 0);
  sendEvent('eval_completed', { result: result.result });
  if(window.etFbAfterUse) etFbAfterUse();
  try{ localStorage.setItem('et_evals', String(1 + parseInt(localStorage.getItem('et_evals') || '0', 10))); }catch(e){}
  const t = T();
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = t.progressResult;
  document.getElementById('categoryText').textContent = '';

  // Íconos DESCRIPTIVOS (no ✓/✗): abierto = bordes separados con cierre temporal;
  // cerrado = línea suturada. Ninguna conducta es "correcta" o "errada".
  const iconOpen = '<svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="#00205C" stroke-width="2" stroke-linecap="round"><path d="M7.5 3v18M16.5 3v18"/><path d="M12 4.5v15" stroke-dasharray="2.5 3" opacity="0.55"/></svg>';
  const iconClosed = '<svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="#00205C" stroke-width="2" stroke-linecap="round"><path d="M12 3v18"/><path d="M8.5 7.5h7M8.5 12h7M8.5 16.5h7"/></svg>';

  const isOpen = result.result === 'open';
  const triggerLine = history[history.length-1];
  const triggeringQuestion = t.questions[triggerLine.index];

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="goBack()">${t.backLast}</button>
    </div>
    <div class="result-card ${isOpen ? 'open' : 'closed'}">
      ${isOpen ? iconOpen : iconClosed}
      <div class="result-eyebrow">${t.eyebrowResult}</div>
      <div class="result-title">${result.title}</div>
      <div class="result-detail">${result.detail}</div>
      <details class="trigger-details">
        <summary><span class="label-closed">${t.seeTrigger}</span><span class="label-open">${t.hideTrigger}</span></summary>
        <div class="trigger-box"><b>${triggeringQuestion.category}</b> — "${triggeringQuestion.text}" → ${t.triggerAnswer}: <b>${triggerLine.answer === 'yes' ? t.yes : t.no}</b></div>
      </details>
      <div class="result-neutral">${t.neutralNote}</div>
    </div>
    ${isOpen ? `<div class="anim-pop"><button class="secondary-btn" onclick="startBjorck()">${t.bjorckBtn}</button></div>` : ''}
    <div class="anim-pop"><button class="restart-btn" onclick="restart()">${t.restartBtn}</button></div>
  `;
}

function startBjorck(){
  inBjorckFlow = true;
  bjorckIndex = 0;
  bjorckAnswers = {};
  renderBjorckQuestion();
}

function renderBjorckQuestion(){
  window.scrollTo(0, 0);
  const t = T();
  const q = t.bjorck[bjorckIndex];
  const total = t.bjorck.length;
  document.getElementById('progressFill').style.width = ((bjorckIndex)/total*100) + '%';
  document.getElementById('progressText').textContent = t.progressBjQ(bjorckIndex+1, total);
  document.getElementById('categoryText').textContent = '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="bjorckBack()">${bjorckIndex===0 ? t.backToResult : t.backPrev}</button>
    </div>
    <div class="category-badge bjorck">${ICONS.bjorck}<span>${t.bjorckBadge}</span></div>
    <div class="card">
      <div class="question-text">${q.text}</div>
      <div class="answers">
        <button class="answer-btn no" onclick="bjorckAnswer('no')">${t.no}</button>
        <button class="answer-btn yes" onclick="bjorckAnswer('yes')">${t.yes}</button>
      </div>
    </div>
  `;
}

function bjorckAnswer(ans){
  const t = T();
  const q = t.bjorck[bjorckIndex];
  bjorckAnswers[q.key] = ans;

  if (q.yesGrade && ans === 'yes'){
    renderBjorckResult(q.yesGrade);
    return;
  }

  if (bjorckIndex < t.bjorck.length - 1){
    bjorckIndex++;
    renderBjorckQuestion();
  } else {
    // Fin: combinar fijación + contaminación
    const fixation = bjorckAnswers.fixation === 'yes';
    const contamination = bjorckAnswers.contamination === 'yes';
    let grade;
    if (!fixation && !contamination) grade = t.grades.g1a;
    else if (!fixation && contamination) grade = t.grades.g1b;
    else if (fixation && !contamination) grade = t.grades.g2a;
    else grade = t.grades.g2b;
    renderBjorckResult(grade);
  }
}

function bjorckBack(){
  if (bjorckIndex === 0){
    inBjorckFlow = false;
    const last = history[history.length-1];
    renderResult(last.outcome);
    return;
  }
  bjorckIndex--;
  renderBjorckQuestion();
}

function renderBjorckResult(grade){
  window.scrollTo(0, 0);
  sendEvent('bjorck_completed', { grade: grade.grade });
  const t = T();
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = t.progressBjResult;
  document.getElementById('categoryText').textContent = '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="startBjorck()">${t.redoBjorck}</button>
    </div>
    <div class="result-card bjorck">
      <div class="result-eyebrow">${t.eyebrowBjorck}</div>
      <div class="grade-pill">${grade.grade}</div>
      <div class="result-title" style="font-size:1.05rem;">${grade.label}</div>
      <div class="result-detail">${grade.detail}</div>
      <div class="caution-box">${t.caution}</div>
      <button class="calc-btn" style="margin-top:16px;" onclick="openMiaa('conducta')">${t.seeConducta}</button>
    </div>
    <div class="anim-pop"><button class="restart-btn" onclick="restart()">${t.restartBtn}</button></div>
  `;
}

function answer(ans){
  const t = T();
  const q = t.questions[currentIndex];
  const outcome = q[ans];
  history.push({ index: currentIndex, answer: ans, outcome: outcome !== 'next' ? outcome : null });

  if (outcome === 'next'){
    currentIndex++;
    renderQuestion();
  } else {
    renderResult(outcome);
  }
}

function goBack(){
  if (inBjorckFlow){ inBjorckFlow = false; }
  if (history.length === 0) return;
  const last = history.pop();
  currentIndex = last.index;
  renderQuestion();
}


function restart(){
  currentIndex = 0;
  history = [];
  inBjorckFlow = false;
  bjorckIndex = 0;
  bjorckAnswers = {};
  renderStart();

}

if(window.etFbInit) etFbInit('abdomen','Abdomen Abierto');
applyStaticTexts();
renderMenu();
sendEvent('app_open');

/* ============ Instalación: prompt nativo (Android) / guía visual (iOS) ============ */
let deferredPrompt = null;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && 'ontouchend' in document);
const IS_STANDALONE = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

function refreshInstallBanner(){
  const banner = document.getElementById('installBanner');
  if (!banner) return;
  const t = T();
  if (IS_STANDALONE || localStorage.getItem('installDismissed') === '1'){
    banner.classList.remove('show');
    return;
  }
  const btn = document.getElementById('installBtn');
  if (IS_IOS){
    document.getElementById('installText').innerHTML = t.installIOSShort;
    btn.style.display = '';
    btn.textContent = t.iosHow;
    btn.onclick = showIOSGuide;
    banner.classList.add('show');
  } else if (deferredPrompt){
    document.getElementById('installText').innerHTML = t.installText;
    btn.style.display = '';
    btn.textContent = t.installBtn;
    btn.onclick = promptInstall;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallBanner();
});
window.addEventListener('appinstalled', () => {
  sendEvent('pwa_installed');
  const b = document.getElementById('installBanner');
  if (b) b.classList.remove('show');
});
function promptInstall(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(() => { deferredPrompt = null; refreshInstallBanner(); });
}
function dismissInstall(){
  try{ localStorage.setItem('installDismissed', '1'); }catch(e){}
  document.getElementById('installBanner').classList.remove('show');
}
function showIOSGuide(){
  const t = T();
  let ov = document.getElementById('iosOverlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'iosOverlay';
    ov.className = 'overlay';
    ov.onclick = (e) => { if (e.target === ov) ov.classList.remove('show'); };
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="sheet">
    <h2>${t.iosTitle}</h2>
    ${t.iosSteps.map((s, i) => `<div class="rule-item"><div class="rule-dot"></div><div><b>${i + 1}.</b> ${s}</div></div>`).join('')}
    <button class="close-sheet" onclick="document.getElementById('iosOverlay').classList.remove('show')">${t.iosDone}</button>
  </div>`;
  ov.classList.add('show');
  sendEvent('ios_guide_open');
}
refreshInstallBanner();

// Service worker (requiere https)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing || !hadController) return; // recarga UNA vez cuando llega versión nueva
    refreshing = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.update();
      setInterval(() => reg.update(), 60000); // busca actualización cada minuto mientras esté abierta
    }).catch(() => {});
  });
}
</script>
