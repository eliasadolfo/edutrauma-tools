/* ============ Analytics + cola offline ============ */
const ET_EVENTS_URL = 'https://devn8n.tuescuelademarcas.cl/webhook/et-tools-event';
function etEnqueue(p){ try{ const q=JSON.parse(localStorage.getItem('et_queue')||'[]'); q.push(p); while(q.length>200)q.shift(); localStorage.setItem('et_queue',JSON.stringify(q)); }catch(e){} }
function etPost(p){ return fetch(ET_EVENTS_URL,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(r=>{if(!r.ok)throw 0;}); }
function etFlush(){ let q=[]; try{q=JSON.parse(localStorage.getItem('et_queue')||'[]');}catch(e){} if(!q.length)return; try{localStorage.setItem('et_queue','[]');}catch(e){} q.forEach(p=>etPost(p).catch(()=>etEnqueue(p))); }
window.addEventListener('online', etFlush); etFlush();
function etAnonId(){ let id=localStorage.getItem('et_anon'); if(!id){ id=(crypto.randomUUID?crypto.randomUUID():'a-'+Date.now()+'-'+Math.random().toString(36).slice(2)); localStorage.setItem('et_anon',id);} return id; }
function etLang(){ try{ const l=localStorage.getItem('lang'); return ['es','en','pt'].includes(l)?l:'es'; }catch(e){ return 'es'; } }
function sendEvent(event, extra){ try{ let p={}; try{p=JSON.parse(localStorage.getItem('et_profile')||'{}');}catch(e){} const __p={ts:new Date().toISOString(),anon_id:etAnonId(),event,tool:'teg',lang:etLang(),country:p.country||'',specialty:p.specialty||'',tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),ua:navigator.userAgent.slice(0,180),extra:extra||{}}; etPost(__p).catch(()=>etEnqueue(__p)); }catch(e){} }

/* ============ Panel TEG6s ============
   Rangos del panel TEG6s Global Hemostasis (idénticos en los 3 idiomas).
   ====================================== */
const FIELDS = [
  { id:'hep', t:'seg' },
  { id:'ckr',  t:'num', label:'CK · R', unit:'min', plaus:[0,30] },
  { id:'ckhr', t:'num', label:'CKH · R', unit:'min', plaus:[0,30], onlyIfHep:true },
  { id:'crta10', t:'num', label:'CRT · A10', unit:'mm', plaus:[0,100] },
  { id:'crtma',  t:'num', label:'CRT · MA',  unit:'mm', plaus:[0,100] },
  { id:'cffa10', t:'num', label:'CFF · A10', unit:'mm', plaus:[0,100] },
  { id:'cffma',  t:'num', label:'CFF · MA',  unit:'mm', plaus:[0,100] },
  { id:'ly30',   t:'num', label:'CRT · LY30', unit:'%', plaus:[0,100] }
];
/* Umbral configurable (§4.1 del anexo): 0 = comparación simple (tabla original).
   Cambiar a 2 para exigir CK-R mayor que CKH-R por ≥ 2 minutos. */
const HEPARIN_MIN_DIFF = 0;

function computeTEG(v){
  const t = T(), comp = [], alerts = [];
  const hep = v.hep === 'si';

  /* Paso 1 — efecto de heparina */
  if(hep){
    if(v.ckr < v.ckhr) alerts.push({ level:'warn', title:t.hepNaT, text:t.hepNa });
    else if((v.ckr - v.ckhr) > HEPARIN_MIN_DIFF) alerts.push({ level:'alert', title:t.hepYesT, text:t.hepYes(v.ckr, v.ckhr) });
    else alerts.push({ level:'ok', title:t.hepNoT, text:t.hepNo });
  }

  /* Paso 2 — factores de coagulación */
  const rVal = hep ? v.ckhr : v.ckr;
  const rName = hep ? 'CKH-R' : 'CK-R';
  const rLo = hep ? 4.3 : 4.6, rHi = hep ? 8.3 : 9.1;
  const rRange = ' (' + t.normal + ' ' + rLo + '–' + rHi + ')';
  if(rVal > rHi) comp.push({ name:t.cFactors, level:'alert',
    value:rName+' '+rVal+' min · '+t.rLong+rRange, finding:t.facLow, sug:t.facLowS });
  else if(rVal < rLo) comp.push({ name:t.cFactors, level:'warn',
    value:rName+' '+rVal+' min · '+t.rShort+rRange, finding:t.facHigh, sug:t.facHighS });
  else comp.push({ name:t.cFactors, level:'ok',
    value:rName+' '+rVal+' min'+rRange, finding:t.facOk, sug:'' });

  /* Paso 3 — plaquetas (MA prima sobre A10) */
  const pltVal = 'CRT-A10 '+v.crta10+' mm (44–67) · CRT-MA '+v.crtma+' mm (52–70)';
  if((v.crtma < 52) || (v.crtma >= 52 && v.crtma <= 70 && v.crta10 < 44))
    comp.push({ name:t.cPlt, level:'alert', value:pltVal, finding:t.pltLow, sug:t.pltLowS });
  else if(v.crtma > 70)
    comp.push({ name:t.cPlt, level:'warn', value:pltVal, finding:t.pltHigh, sug:t.pltHighS });
  else comp.push({ name:t.cPlt, level:'ok', value:pltVal, finding:t.pltOk, sug:'' });

  /* Paso 4 — fibrinógeno (MA prima sobre A10) */
  const fibVal = 'CFF-A10 '+v.cffa10+' mm (15–30) · CFF-MA '+v.cffma+' mm (15–32)';
  if((v.cffma < 15) || (v.cffma >= 15 && v.cffma <= 32 && v.cffa10 < 15))
    comp.push({ name:t.cFib, level:'alert', value:fibVal, finding:t.fibLow, sug:t.fibLowS });
  else if(v.cffma > 32)
    comp.push({ name:t.cFib, level:'warn', value:fibVal, finding:t.fibHigh, sug:t.fibHighS });
  else comp.push({ name:t.cFib, level:'ok', value:fibVal, finding:t.fibOk, sug:'' });

  /* Paso 5 — fibrinólisis */
  const lysVal = 'CRT-LY30 '+v.ly30+'% ('+t.normal+' 0–2.2%)';
  if(v.ly30 > 2.2) comp.push({ name:t.cLysis, level:'alert', value:lysVal, finding:t.lysHigh, sug:t.lysHighS });
  else comp.push({ name:t.cLysis, level:'ok', value:lysVal, finding:t.lysOk, sug:'' });

  return { comp, alerts };
}

function activeFields(){ return FIELDS.filter(f => !f.onlyIfHep || vals.hep === 'si'); }
function isReady(){ return activeFields().every(f => f.t==='seg' ? vals[f.id]!==undefined : (vals[f.id]!==undefined && !isNaN(vals[f.id]))); }

/* Acepta coma o punto: en los teclados en español el separador decimal es ","
   y <input type=number> devolvía vacío ("no me agarra el punto"). */
function etParseNum(val){
  if(val==null) return undefined;
  const s=String(val).trim().replace(/\s/g,'').replace(',','.');
  if(s==='') return undefined;
  const n=parseFloat(s);
  return isNaN(n) ? undefined : n;
}

  const fields = activeFields().map(f=>{
    if(f.t === 'seg'){
      const opts = [{v:'no',label:t.no},{v:'si',label:t.yes}]
        .map(o=>`<button class="${vals.hep===o.v?'on':''}" onclick="setSeg('hep','${o.v}')">${o.label}</button>`).join('');
      return `<div class="calc-field"><label>${t.hepQ}</label><div class="seg">${opts}</div></div>`;
    }
    const bad = vals[f.id]!==undefined && !isNaN(vals[f.id]) && (vals[f.id]<f.plaus[0] || vals[f.id]>f.plaus[1]);
    return `<div class="calc-field"><label>${f.label}</label>
      <div class="row"><input type="text" inputmode="decimal" autocomplete="off" id="in_${f.id}"
        oninput="setNum('${f.id}',this.value)" value="${vals[f.id]??''}"><div class="unit">${f.unit}</div></div>
      <div style="font-size:0.78rem;color:var(--et-muted);margin-top:4px;">${t.f[f.id]}</div>
      ${bad?`<div style="font-size:0.78rem;color:#B7791F;margin-top:4px;">${t.outOfRange}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML =
    `<p style="font-size:0.88rem;color:var(--et-muted);line-height:1.5;margin:2px 0 14px;">${t.intro}</p>` +
    fields +
    `<button class="calc-btn" id="goBtn" onclick="interpretar()" ${isReady()?'':'disabled'}>${t.go}</button>` +
    (window.etToolFooter ? etToolFooter(t.hubLink, t.fbLink) : '');
}
function setSeg(id,val){ vals[id]=val; if(id==='hep'&&val==='no') delete vals.ckhr; renderForm(); }
function setNum(id,val){ vals[id] = etParseNum(val); const b=document.getElementById('goBtn'); if(b) b.disabled=!isReady(); }

function interpretar(){
  if(!isReady()) return;
  const r = computeTEG(vals);
  sendEvent('teg_result', { level:(r.comp.some(c=>c.level==='alert')?'alert':'ok') });
  if(window.etFbAfterUse) etFbAfterUse();
  renderResumen(r);
}

function renderResumen(r){
  setHeader(false); window.scrollTo(0,0);
  const t = T();
  const alertHTML = r.alerts.map(al=>`
    <div style="border:1px solid ${LVL[al.level]};background:${al.level==='ok'?'#eef7f3':al.level==='warn'?'#fdf6e7':'#fdecea'};
      border-radius:11px;padding:12px 14px;margin-bottom:10px;text-align:left;">
      <div style="font-weight:800;font-size:0.9rem;color:${LVL[al.level]};">${al.title}</div>
      <div style="font-size:0.86rem;line-height:1.5;margin-top:3px;">${al.text}</div></div>`).join('');
  const compHTML = r.comp.map(c=>`
    <div style="border:1px solid var(--et-line);border-left:4px solid ${LVL[c.level]};background:var(--et-bg);
      border-radius:11px;padding:12px 14px;margin-bottom:10px;text-align:left;">
      <div style="font-weight:800;font-size:0.95rem;color:${LVL[c.level]};">${c.name} — ${c.finding}</div>
      <div style="font-size:0.8rem;color:var(--et-muted);margin-top:3px;">${c.value}</div>
      ${c.sug?`<div style="font-size:0.86rem;line-height:1.55;margin-top:7px;">${c.sug}</div>`:''}
    </div>`).join('');
  document.getElementById('main').innerHTML = `
    <div class="back-row"><button class="back-btn" onclick="renderForm()">${t.back}</button></div>
    <div class="result-eyebrow" style="margin:4px 0 10px;">${t.eyebrow}</div>
    ${alertHTML}${compHTML}
    <div class="caution-box">${t.caution}</div>
    <div class="calc-formula"><b>${t.refLabel}:</b> ${t.ref}</div>
    <button class="restart-btn" onclick="nuevoCaso()">${t.restart}</button>
    ${window.etToolFooter ? etToolFooter(t.hubLink, t.fbLink) : ''}
  `;
}
function nuevoCaso(){ vals = { hep:'no' }; renderForm(); }

/* ---------- Gate de especialidad (compartido) ---------- */
function needSpec(){ try{ return !JSON.parse(localStorage.getItem('et_profile')||'{}').specialty; }catch(e){ return true; } }
function renderSpecGate(){
  setHeader(false);
  const t = T();
  const chips = t.specialties.map(s=>`<button onclick="pickSpec(this.textContent)">${s}</button>`).join('');
  document.getElementById('main').innerHTML=`<div class="card"><div class="question-text">${t.specTitle}</div>
    <p class="spec-sub">${t.specSub}</p>
    <div class="spec-grid">${chips}</div></div>`;
}
function pickSpec(s){
  const t = T();
  if(s===t.specialties[t.specialties.length-1]){
    document.getElementById('main').innerHTML=`<div class="card"><div class="question-text">${t.specTitle}</div>
      <input class="spec-input" id="so" maxlength="60" placeholder="${t.specOtherPh}" oninput="document.getElementById('sg').disabled=!this.value.trim()">
      <button class="spec-continue" id="sg" disabled onclick="saveSpec(document.getElementById('so').value.trim())">${t.specContinue}</button></div>`;
    setTimeout(()=>document.getElementById('so').focus(),100); return;
  }
  saveSpec(s);
}
function saveSpec(s){ if(!s)return; let p={}; try{p=JSON.parse(localStorage.getItem('et_profile')||'{}');}catch(e){} p.specialty=s.slice(0,60); localStorage.setItem('et_profile',JSON.stringify(p)); sendEvent('profile_saved',{specialty:p.specialty}); renderForm(); }

/* ---------- Instalación PWA ---------- */
let deferredPrompt=null;
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&'ontouchend' in document);
const IS_STANDALONE=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
function ensureBanner(){ if(document.getElementById('installBanner'))return; const b=document.createElement('div'); b.className='install-banner'; b.id='installBanner'; b.innerHTML='<span id="installText"></span><button id="installBtn"></button><button class="close-x" onclick="dismissInstall()" aria-label="✕">✕</button>'; document.querySelector('.brand-ribbon').after(b); }
function refreshInstallBanner(){
  ensureBanner(); const banner=document.getElementById('installBanner'); const t=T();
  if(IS_STANDALONE||localStorage.getItem('installDismissed')==='1'){ banner.classList.remove('show'); return; }
  // No ofrecer instalar antes del primer resultado útil (ver design/feedback.js)
  if (window.etShouldOfferInstall && !window.etShouldOfferInstall()){ banner.classList.remove('show'); return; }
  const btn=document.getElementById('installBtn');
  if(IS_IOS){ document.getElementById('installText').innerHTML=t.installIOS; btn.style.display=''; btn.textContent=t.iosHow; btn.onclick=showIOSGuide; banner.classList.add('show'); }
  else if(deferredPrompt){ document.getElementById('installText').innerHTML=t.installText; btn.style.display=''; btn.textContent=t.installBtn; btn.onclick=promptInstall; banner.classList.add('show'); }
  else { banner.classList.remove('show'); }
}
window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; refreshInstallBanner(); });
window.addEventListener('appinstalled',()=>{ sendEvent('pwa_installed'); const b=document.getElementById('installBanner'); if(b)b.classList.remove('show'); });
function promptInstall(){ if(!deferredPrompt)return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; refreshInstallBanner(); }); }
function dismissInstall(){ try{localStorage.setItem('installDismissed','1');}catch(e){} document.getElementById('installBanner').classList.remove('show'); }
function showIOSGuide(){ const t=T(); let ov=document.getElementById('iosOverlay'); if(!ov){ ov=document.createElement('div'); ov.id='iosOverlay'; ov.className='overlay'; ov.onclick=(e)=>{if(e.target===ov)ov.classList.remove('show');}; document.body.appendChild(ov);} ov.innerHTML=`<div class="sheet"><h2>${t.iosTitle}</h2>${t.iosSteps.map((s,i)=>`<div class="rule-item"><div class="rule-dot"></div><div><b>${i+1}.</b> ${s}</div></div>`).join('')}<button class="close-sheet" onclick="document.getElementById('iosOverlay').classList.remove('show')">${t.iosDone}</button></div>`; ov.classList.add('show'); sendEvent('ios_guide_open'); }

/* ---------- Init ---------- */
if(window.etFbInit) etFbInit('teg','TEG6s');
applyStaticTexts();
if(needSpec()){ renderSpecGate(); } else { renderForm(); }
sendEvent('app_open');
refreshInstallBanner();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadController=!!navigator.serviceWorker.controller; let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(refreshing||!hadController)return; refreshing=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{ reg.update(); setInterval(()=>reg.update(),60000); }).catch(()=>{}); });
}
</script>
</body>
</html>
